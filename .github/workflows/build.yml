name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip project
        run: |
          mkdir app
          unzip -q "$(ls *.zip | head -1)" -d app
          D=$(dirname "$(find app -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "APP_DIR=$D" >> $GITHUB_ENV
      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build web
        working-directory: ${{ env.APP_DIR }}
        run: npm run build
      - name: Add Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android
      - name: Icons
        working-directory: ${{ env.APP_DIR }}
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - name: Sync
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android
      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: navid-music-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
